      <stop offset="0%" stop-color="#082554"/>
      <stop offset="50%" stop-color="#1262E3"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <linearGradient id="apple-orbit" x1="20" y1="160" x2="160" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
